# Example Home Assistant package for the Pynab HA bridge.
#
# Copy this file to Home Assistant, for example:
# /config/packages/nabaztag.yaml
#
# Ensure packages are enabled in configuration.yaml:
#
# homeassistant:
#   packages: !include_dir_named packages

rest_command:
  nabaztag_ears:
    url: "http://nabaztag.local:10544/ears"
    method: post
    content_type: "application/json"
    payload: >
      {"left":{{ left | int }},"right":{{ right | int }}}

  nabaztag_leds:
    url: "http://nabaztag.local:10544/leds/info"
    method: post
    content_type: "application/json"
    payload: >
      {"info_id":"{{ info_id }}","tempo":{{ tempo | int }},"colors":{{ colors }}}

  nabaztag_clear_leds:
    url: "http://nabaztag.local:10544/leds/clear"
    method: post
    content_type: "application/json"
    payload: >
      {"info_id":"{{ info_id }}"}

  nabaztag_reset_leds:
    url: "http://nabaztag.local:10544/leds/reset"
    method: post
    content_type: "application/json"
    payload: "{}"

  nabaztag_sleep:
    url: "http://nabaztag.local:10544/sleep"
    method: post
    content_type: "application/json"
    payload: "{}"

  nabaztag_wakeup:
    url: "http://nabaztag.local:10544/wakeup"
    method: post
    content_type: "application/json"
    payload: "{}"

  nabaztag_quiet_on:
    url: "http://nabaztag.local:10544/quiet/on"
    method: post
    content_type: "application/json"
    payload: "{}"

  nabaztag_quiet_off:
    url: "http://nabaztag.local:10544/quiet/off"
    method: post
    content_type: "application/json"
    payload: "{}"

  nabaztag_restart_wyoming:
    url: "http://nabaztag.local:10544/wyoming/restart"
    method: post
    content_type: "application/json"
    payload: "{}"

  nabaztag_play_mp3_url:
    url: "http://nabaztag.local:10544/audio/url"
    method: post
    content_type: "application/json"
    payload: >
      {"url":"{{ url }}","cancelable":{{ cancelable | default(false) | to_json }}}

  nabaztag_say:
    url: "http://nabaztag.local:10544/tts/ha"
    method: post
    content_type: "application/json"
    payload: >
      {"engine_id":"{{ engine_id }}","message":{{ message | to_json }},"cache":true}

  nabaztag_say_weather:
    url: "http://nabaztag.local:10544/weather/say"
    method: post
    content_type: "application/json"
    payload: >
      {"engine_id":{{ engine_id | to_json }},"condition":{{ condition | to_json }},"temperature":{{ temperature | to_json }},"unit":{{ unit | to_json }},"wind_speed":{{ wind_speed | to_json }},"wind_unit":{{ wind_unit | to_json }},"message_language":"de","cache":true}

script:
  nabaztag_move_ears:
    alias: Nabaztag - Move ears
    mode: queued
    fields:
      left:
        required: true
        selector:
          number:
            min: 0
            max: 16
            mode: slider
      right:
        required: true
        selector:
          number:
            min: 0
            max: 16
            mode: slider
    sequence:
      - action: rest_command.nabaztag_ears
        data:
          left: "{{ left | int }}"
          right: "{{ right | int }}"

  nabaztag_led_effect:
    alias: Nabaztag - LED effect
    mode: queued
    fields:
      info_id:
        required: false
        default: ha_effect
        selector:
          text: {}
      tempo:
        required: false
        default: 40
        selector:
          number:
            min: 1
            max: 300
            mode: box
      colors:
        required: true
        selector:
          text:
            multiline: true
    sequence:
      - action: rest_command.nabaztag_leds
        data:
          info_id: "{{ info_id | default('ha_effect') }}"
          tempo: "{{ tempo | default(40) | int }}"
          colors: "{{ colors }}"

  nabaztag_clear_led_effect:
    alias: Nabaztag - Clear LED effect
    mode: queued
    fields:
      info_id:
        required: false
        default: ha_effect
        selector:
          text: {}
    sequence:
      - action: rest_command.nabaztag_clear_leds
        data:
          info_id: "{{ info_id | default('ha_effect') }}"

  nabaztag_reset_leds:
    alias: Nabaztag - Reset LEDs
    mode: queued
    sequence:
      - action: rest_command.nabaztag_reset_leds

  nabaztag_sleep:
    alias: Nabaztag - Sleep
    mode: single
    sequence:
      - action: rest_command.nabaztag_sleep

  nabaztag_wakeup:
    alias: Nabaztag - Wake up
    mode: single
    sequence:
      - action: rest_command.nabaztag_wakeup
      - action: rest_command.nabaztag_ears
        data:
          left: 0
          right: 0
      - action: rest_command.nabaztag_clear_leds
        data:
          info_id: ha_effect
      - action: rest_command.nabaztag_clear_leds
        data:
          info_id: ha_weather

  nabaztag_quiet_on:
    alias: Nabaztag - Quiet mode on
    mode: single
    sequence:
      - action: rest_command.nabaztag_quiet_on

  nabaztag_quiet_off:
    alias: Nabaztag - Quiet mode off
    mode: single
    sequence:
      - action: rest_command.nabaztag_quiet_off

  nabaztag_restart_wyoming:
    alias: Nabaztag - Restart Wyoming satellite
    mode: single
    sequence:
      - action: rest_command.nabaztag_restart_wyoming

  nabaztag_show_weather:
    alias: Nabaztag - Show weather
    mode: queued
    fields:
      weather_entity:
        required: false
        default: weather.home
        selector:
          entity:
            domain: weather
      tts_entity:
        required: false
        selector:
          entity:
            domain: tts
    sequence:
      - variables:
          weather_target: "{{ weather_entity | default('weather.home') }}"
          condition: "{{ states(weather_entity | default('weather.home')) }}"
          temperature: "{{ state_attr(weather_entity | default('weather.home'), 'temperature') }}"
          unit: "{{ state_attr(weather_entity | default('weather.home'), 'temperature_unit') or 'Grad' }}"
          wind_speed: "{{ state_attr(weather_entity | default('weather.home'), 'wind_speed') }}"
          wind_unit: "{{ state_attr(weather_entity | default('weather.home'), 'wind_speed_unit') or 'km/h' }}"
      - action: rest_command.nabaztag_say_weather
        data:
          engine_id: "{{ tts_entity }}"
          condition: "{{ condition }}"
          temperature: "{{ temperature }}"
          unit: "{{ unit }}"
          wind_speed: "{{ wind_speed }}"
          wind_unit: "{{ wind_unit }}"
