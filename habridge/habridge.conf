# Bind on all interfaces so Home Assistant can call the bridge.
HABRIDGE_HOST=0.0.0.0
HABRIDGE_PORT=10544

# Optional shared secret. If set, requests must use either:
# Authorization: Bearer <token>
# or ?token=<token>
# HABRIDGE_TOKEN=

HABRIDGE_NABD_HOST=127.0.0.1
HABRIDGE_NABD_PORT=10543
HABRIDGE_NABD_TIMEOUT=10
HABRIDGE_INFO_ID=ha_bridge

# Optional: enable /tts/ha. Use the Home Assistant URL that the Nabaztag can
# reach from the LAN, not http://127.0.0.1:8123.
# HABRIDGE_HA_URL=http://homeassistant.local:8123
# HABRIDGE_HA_TOKEN=
